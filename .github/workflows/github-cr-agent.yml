name: GitHub CR Agent

# Generic per-repository code review agent.
# Reviews the PR diff with Azure OpenAI and posts a single PR review comment.
# Same engine/pattern as ci-failure-analysis.yml — no agentic toolchain.
#
# Triggers:
#   - pull_request: opened / reopened / ready_for_review
#   - issue_comment containing "/review" on a PR (manual re-review)
#
# Required secret: AZURE_OPENAI_KEY
# Optional repo variables: AZURE_OPENAI_ENDPOINT, AZURE_OPENAI_DEPLOYMENT

on:
  pull_request:
    types: [opened, reopened, ready_for_review]
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write

jobs:
  code-review:
    # Run on PR events, or on a "/review" comment on a PR.
    if: |
      github.event_name == 'pull_request' ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.pull_request != null &&
       contains(github.event.comment.body, '/review'))
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout PR head (for /review comments)
        if: github.event_name == 'issue_comment'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh pr checkout ${{ github.event.issue.number }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install openai

      - name: Run CR Agent
        env:
          AZURE_OPENAI_ENDPOINT: ${{ vars.AZURE_OPENAI_ENDPOINT || 'https://keshet-foundry.openai.azure.com/openai/v1' }}
          AZURE_OPENAI_KEY: ${{ secrets.AZURE_OPENAI_KEY }}
          AZURE_OPENAI_DEPLOYMENT: ${{ vars.AZURE_OPENAI_DEPLOYMENT || 'gpt-4o-1' }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
          BASE_REF: ${{ github.base_ref || 'main' }}
        run: python scripts/cr_review.py
